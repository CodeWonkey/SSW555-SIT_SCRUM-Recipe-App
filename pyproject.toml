[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs555-recipe-journal"
version = "0.1.0"
description = "Team starter for the CS555 recipe journal project"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
