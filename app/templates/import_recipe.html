{% extends "base.html" %}

{% block title %}Import Recipe · Recipe Journal{% endblock %}

{% block content %}
  <section class="section-heading">
    <h2>Import a recipe</h2>
    <a class="button button-outline" href="{{ url_for('main.add_recipe') }}">Add manually</a>
  </section>
  <p>Paste a recipe page URL to import it, then review and edit the recipe before saving.</p>

  <form method="POST"
        action="{{ url_for('main.import_recipe') }}"
        class="recipe-form">
    <div class="form-field">
      <label for="source_url">Recipe website URL</label>
      <input
        type="url"
        id="source_url"
        name="source_url"
        placeholder="https://example.com/recipe"
        value="{{ source_url }}"
        required
      >
    </div>

    <button type="submit" class="button">Import recipe</button>
  </form>

{% if error %}
  <p role="alert">{{ error }}</p>
{% endif %}

{% endblock %}
