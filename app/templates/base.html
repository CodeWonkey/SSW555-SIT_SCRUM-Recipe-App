<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe Journal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.home') }}">Recipe Journal</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('main.home') }}">My recipes</a>
      <a href="{{ url_for('main.shopping_list') }}">Shopping List</a>
      {% if session.get("user_name") %}
        <span class="signed-in">{{ session.user_name }}</span>
        <form method="POST" action="{{ url_for('main.logout') }}" class="logout-form">
          <button type="submit" class="button button-outline">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('main.login') }}">Log in</a>
        <a href="{{ url_for('main.register') }}">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer">CS555 team starter · Sample content only</footer>
</body>
</html>
