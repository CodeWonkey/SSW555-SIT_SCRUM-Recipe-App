{% extends "base.html" %}
{% block title %}Create account · Recipe Journal{% endblock %}
{% block content %}
  <section class="section-heading">
    <div>
      <p class="eyebrow">NEW ACCOUNT</p>
      <h2>Create an account</h2>
    </div>
    <a class="button button-outline" href="{{ url_for('main.home') }}">Cancel</a>
  </section>

  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="POST" class="account-form">
    <div class="form-field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required value="{{ name or '' }}" autocomplete="name">
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required value="{{ email or '' }}" autocomplete="email">
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      <p class="field-hint">At least 8 characters.</p>
    </div>

    <div class="form-field">
      <label for="password_confirm">Confirm password</label>
      <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password">
    </div>

    <div class="form-actions">
      <button type="submit" class="button">Create account</button>
    </div>
  </form>
{% endblock %}
