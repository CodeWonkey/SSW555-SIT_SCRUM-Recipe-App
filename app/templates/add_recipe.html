{% extends "base.html" %}
{% block title %}Add Recipe · Recipe Journal{% endblock %}
{% block content %}
  <section class="section-heading">
    <div><p class="eyebrow">NEW RECIPE</p><h2>Add a recipe</h2></div>
    <a class="button button-outline" href="{{ url_for('main.home') }}">Cancel</a>
  </section>

  <form method="POST" class="recipe-form">
    <div class="form-field">
      <label for="title">Recipe title</label>
      <input type="text" id="title" name="title" required placeholder="e.g., Homemade Pancakes">
    </div>

    <div class="form-field">
      <label for="servings">Servings</label>
      <input type="number" id="servings" name="servings" value="4" min="1" required>
    </div>

    <div class="form-field">
      <label for="tags">Tags (comma-separated)</label>
      <input type="text" id="tags" name="tags" placeholder="Breakfast, Easy, Quick">
    </div>

    <div class="form-field">
      <label for="source_link">Source Link (optional)</label>
      <input type="url" id="source_link" name="source_link" placeholder="https://www.instagram.com/reel/...">
    </div>

    <fieldset class="form-field">
      <legend>Ingredients</legend>
      <div id="ingredient-container">
        <div class="ingredient-row">
          <input type="text" name="ingredient_name[]" placeholder="Name (e.g., Flour)" required>
          <input type="number" step="any" name="ingredient_quantity[]" placeholder="Qty" required>
          <input type="text" name="ingredient_unit[]" placeholder="Unit (e.g., cups)">
          <button type="button" class="button-secondary" onclick="removeRow(this)" aria-label="Remove ingredient">×</button>
        </div>
      </div>
      <button type="button" class="button button-outline" onclick="addIngredientRow()">+ Add ingredient</button>
    </fieldset>

    <div class="form-field">
      <label for="steps">Steps (one per line)</label>
      <textarea id="steps" name="steps" rows="5" required placeholder="Mix dry ingredients...&#10;Add wet ingredients..."></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="button">Save recipe</button>
    </div>
  </form>

  <script>
    function addIngredientRow() {
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = `
        <input type="text" name="ingredient_name[]" placeholder="Name" required>
        <input type="number" step="any" name="ingredient_quantity[]" placeholder="Qty" required>
        <input type="text" name="ingredient_unit[]" placeholder="Unit">
        <button type="button" class="button button-outline" onclick="removeRow(this)" aria-label="Remove ingredient">×</button>`;
      document.getElementById('ingredient-container').appendChild(row);
    }

    function removeRow(button) {
      if (document.querySelectorAll('.ingredient-row').length > 1) {
        button.parentElement.remove();
      }
    }
  </script>
{% endblock %}
